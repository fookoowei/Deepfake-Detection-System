        </h2>
      </div>
        <form action="register.php" method="post">
            <div class="form-group">
            <label for="firstName">First Name</label>
            <input
                type="text"
                class="form-control"
                id="firstName"
                name="firstName"
                placeholder="e.g. Keith"
                
            />
            </div>
            <div class="form-group">
            <label for="lastName">Last Name</label>
            <input
                type="text"
                class="form-control"
                id="lastName"
                name="lastName"
                placeholder="e.g. Lake"
            />
            </div>
            <div class="form-group">
            <label for="email">Email</label>
            <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                placeholder="e.g. example123@gmail.com"
            />
            </div>
            <div class="form-group">
            <label for="password">Password</label>
            <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                placeholder="e.g. abcXYZ123@"
            />
            </div>
            <div class="form-group">
            <label for="number">Confirm Password</label>
            <input
                type="password"
                class="form-control"
                id="confirm"
                name="confirm"
                placeholder="e.g. abcXYZ123@"
            />
            </div>
            <input type="submit" class="btn btn-primary" />
        </form>
    </div>
